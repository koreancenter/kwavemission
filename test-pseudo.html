<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; height: 200vh; padding: 0; margin: 0; }
  .text-content { padding-top: 150px; font-size: 20px; line-height: 1.5; }
  .glass-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100px;
    z-index: 50;
    /* We don't put background/blur here directly */
  }
  .glass-nav::before {
    content: '';
    position: absolute;
    inset: 0;
    /* Increase height slightly so blur extends down */
    bottom: -20px; 
    background: linear-gradient(to top, rgba(236, 233, 225, 0) 0%, rgba(236, 233, 225, 0.8) 30%, rgba(236, 233, 225, 0.95) 70%, rgba(236, 233, 225, 1) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    /* mask the pseudo element to fade out the blur at the bottom */
    -webkit-mask-image: linear-gradient(to top, transparent 0%, black 30%);
    mask-image: linear-gradient(to top, transparent 0%, black 30%);
    z-index: -1;
  }
  .nav-content {
    position: relative;
    height: 80px; /* actual header content height */
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
</style>
</head>
<body>
  <header class="glass-nav">
    <div class="nav-content">
      <strong>Logo</strong>
      <nav>Links</nav>
    </div>
  </header>
  <div class="text-content">
    <p>Scroll me up!</p>
    <p>This text should dissolve beautifully.</p>
    <p>Line 3</p>
    <p>Line 4</p>
    <p>Line 5</p>
    <p>Line 6</p>
    <p>Line 7</p>
    <p>Line 8</p>
  </div>
</body>
</html>
