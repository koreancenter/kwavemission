<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Wave Mission - 글 작성</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    input[type="text"], input[type="password"], input[type="file"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    textarea { height: 200px; resize: vertical; }
    #preview { max-width: 100%; margin-top: 10px; display: none; border-radius: 6px; }
    button { background: #0056b3; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
    button:hover { background: #003d82; }
    #status { margin-top: 20px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <h2>새 글 작성</h2>

  <form id="postForm">
    <!-- 관리자 비밀번호 -->
    <div class="form-group">
      <label for="password">관리자 비밀번호</label>
      <input type="password" id="password" required placeholder="비밀번호 입력">
    </div>

    <!-- 1. 게시글 유형 선택 (news / notice) -->
    <div class="form-group">
      <label for="type">게시글 유형</label>
      <select id="type">
        <option value="news" selected>뉴스 (news)</option>
        <option value="notice">공지사항 (notice)</option>
      </select>
    </div>

    <!-- 2. 제목 -->
    <div class="form-group">
      <label for="title">제목</label>
      <input type="text" id="title" required placeholder="제목을 입력하세요">
    </div>

    <!-- 3. 대표 사진 첨부 -->
    <div class="form-group">
      <label for="image">대표 사진 첨부 (선택)</label>
      <input type="file" id="image" accept="image/*">
      <img id="preview" alt="선택한 이미지 미리보기">
    </div>

    <!-- 4. 본문 내용 -->
    <div class="form-group">
      <label for="content">본문 내용</label>
      <textarea id="content" required placeholder="본문 내용을 입력하세요..."></textarea>
    </div>

    <button type="submit">글 등록하기</button>
  </form>

  <div id="status"></div>

  <script>
    const imageInput = document.getElementById('image');
    const preview = document.getElementById('preview');

    // 이미지 파일 선택 시 미리보기
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          preview.src = event.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        preview.style.display = 'none';
      }
    });

    // 폼 제출 처리
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = '업로드 중...';
      statusDiv.style.color = 'black';

      const formData = new FormData();
      formData.append('password', document.getElementById('password').value);
      formData.append('type', document.getElementById('type').value); // 유형 전송 (news 또는 notice)
      formData.append('title', document.getElementById('title').value);
      formData.append('content', document.getElementById('content').value);

      const imageFile = imageInput.files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      try {
        const response = await fetch('/api/write-post', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusDiv.textContent = '성공적으로 등록되었습니다!';
          statusDiv.style.color = 'green';
          document.getElementById('postForm').reset();
          preview.style.display = 'none';
        } else {
          statusDiv.textContent = '등록 실패: ' + (result.error || '오류 발생');
          statusDiv.style.color = 'red';
        }
      } catch (err) {
        statusDiv.textContent = '통신 에러가 발생했습니다.';
        statusDiv.style.color = 'red';
      }
    });
  </script>

</body>
</html>
