<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Wave Mission - 통합 관리자 Center</title>
  <link rel="stylesheet" href="./assets/css/style.css?v=20260815-modal-scroll-lock">
</head>
<body>

  <!-- 1. 로그인 전용 레이어 -->
  <div id="loginOverlay">
    <div class="login-box">
      <div class="login-title">🔒 K-Wave Mission 관리자</div>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">아이디</label>
          <input type="email" id="loginEmail" value="admin@kwavemission.org" required readonly class="readonly-field">
        </div>
        <div class="form-group">
          <label for="loginPassword">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호를 입력하세요" required autofocus>
        </div>
        <button type="submit" class="full-width-action">로그인</button>
      </form>
    </div>
  </div>

  <!-- 2. 메인 관리자 상단 헤더 -->
  <div class="admin-header">
    <h1>K-Wave Mission 관리자 센터</h1>
    <button type="button" class="secondary sm" id="logoutBtn">🔒 로그아웃</button>
  </div>

  <!-- 메인 탭 선택 -->
  <div class="nav-tabs">
    <button class="nav-tab-btn active" data-tab="posts">📰 게시글 관리</button>
    <button class="nav-tab-btn" data-tab="programs">🎓 프로그램 관리</button>
  </div>

  <!-- ================= 탭 1: 게시글 관리 ================= -->
  <div id="tab-posts" class="tab-content">
    
    <!-- A. 게시글 목록 뷰 (기본 화면) -->
    <div id="postListView" class="view-section active">
      <div class="card">
        <div class="list-header-action">
          <h2>게시글 목록</h2>
          <button type="button" data-action="show-post-editor"><span class="action-icon">+</span> 새 글 작성</button>
        </div>

        <div class="filter-tabs">
          <button class="filter-btn active" data-type="all">전체보기</button>
          <button class="filter-btn" data-type="news">뉴스만</button>
          <button class="filter-btn" data-type="notice">공지사항만</button>
        </div>

        <div class="list-toolbar">
          <div class="search-box">
            <span>🔎</span>
            <input id="postSearchInput" type="search" placeholder="키워드, 날짜(2026-07), 상태(status:news) 검색">
          </div>
          <button type="button" class="secondary outline sm" id="postResetBtn">초기화</button>
        </div>

        <table>
          <thead>
            <tr>
              <th class="col-post-id">ID</th>
              <th class="col-post-image">사진</th>
              <th class="col-post-type">분류</th>
              <th>제목</th>
              <th class="col-post-date">작성일</th>
              <th class="col-post-actions">관리</th>
            </tr>
          </thead>
          <tbody id="postTableBody">
            <tr><td colspan="6" class="table-message">게시글을 불러오는 중...</td></tr>
          </tbody>
        </table>

        <div class="list-footer">
          <div class="list-meta" id="postListMeta">0개 항목</div>
          <button type="button" class="secondary outline list-load-more" id="postLoadMoreBtn">더 보기</button>
        </div>
      </div>
    </div>

    <!-- B. 게시글 작성/수정 에디터 뷰 -->
    <div id="postEditorView" class="view-section">
      <div class="card">
        <div class="editor-heading">
          <h2 id="postFormTitle">새 글 작성</h2>
          <button type="button" class="secondary outline sm" data-action="hide-post-editor">← 목록으로 돌아가기</button>
        </div>

        <form id="postForm">
          <input type="hidden" id="postId" value="">

          <div class="form-group">
            <label for="postType">게시글 분류</label>
            <select id="postType">
              <option value="news">뉴스 (news)</option>
              <option value="notice">공지사항 (notice)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="postTitle">제목 <span class="required-mark">*</span></label>
            <input type="text" id="postTitle" required placeholder="제목을 입력하세요">
          </div>

          <div class="form-group">
            <label for="postImage">대표 썸네일 이미지</label>
            <input type="file" id="postImage" accept="image/*">
            <img id="preview-img" alt="대표 이미지 미리보기">
          </div>

          <div class="ai-assistant-box" data-target="postContent"></div>

          <div class="form-group">
            <label for="postContent">본문 내용 (HTML 가능) <span class="required-mark">*</span></label>
            <textarea id="postContent" required placeholder="본문 내용이나 HTML 양식을 입력하세요..."></textarea>
          </div>

          <div class="btn-group">
            <button type="submit" id="postSubmitBtn">글 저장하기</button>
            <button type="button" class="outline" id="formPreviewBtn">👁️ 작성중 미리보기 (HTML 렌더링)</button>
            <button type="button" class="secondary" data-action="hide-post-editor">취소</button>
          </div>
        </form>

        <div id="postStatus" class="status-msg"></div>
      </div>
    </div>

  </div>

  <!-- ================= 탭 2: 프로그램 관리 ================= -->
  <div id="tab-programs" class="tab-content">
    
    <!-- A. 프로그램 목록 뷰 -->
    <div id="programListView" class="view-section active">
      <div class="card">
        <div class="list-header-action">
          <h2>등록된 프로그램 목록</h2>
          <button type="button" data-action="show-program-editor"><span class="action-icon">+</span> 새 프로그램 등록</button>
        </div>

        <div class="list-toolbar">
          <div class="search-box">
            <span>🔎</span>
            <input id="programSearchInput" type="search" placeholder="키워드, 날짜, 상태(status:recruiting) 검색">
          </div>
          <button type="button" class="secondary outline sm" id="programResetBtn">초기화</button>
        </div>

        <table>
          <thead>
            <tr>
              <th class="col-program-id">ID</th>
              <th class="col-program-icon">아이콘</th>
              <th class="col-program-slug">슬러그</th>
              <th class="col-program-category">카테고리</th>
              <th>프로그램명</th>
              <th class="col-program-status">상태</th>
              <th class="col-program-actions">관리</th>
            </tr>
          </thead>
          <tbody id="programTableBody">
            <tr><td colspan="7" class="table-message">프로그램을 불러오는 중...</td></tr>
          </tbody>
        </table>

        <div class="list-footer">
          <div class="list-meta" id="programListMeta">0개 항목</div>
          <button type="button" class="secondary outline list-load-more" id="programLoadMoreBtn">더 보기</button>
        </div>
      </div>
    </div>

    <!-- B. 프로그램 작성/수정 뷰 -->
    <div id="programEditorView" class="view-section">
      <div class="card">
        <div class="editor-heading">
          <h2 id="programFormTitle">새 프로그램 등록</h2>
          <button type="button" class="secondary outline sm" data-action="hide-program-editor">← 목록으로 돌아가기</button>
        </div>

        <form id="programForm">
          <input type="hidden" id="programId" value="">

          <div class="form-row">
            <div class="form-group">
              <label for="programSlug">슬러그 (영문 식별자) <span class="required-mark">*</span></label>
              <input type="text" id="programSlug" required placeholder="예: vivid-camp">
            </div>
            <div class="form-group">
              <label for="programCategory">카테고리 <span class="required-mark">*</span></label>
              <input type="text" id="programCategory" required placeholder="예: YOUTH / CAMP">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group form-group-wide">
              <label for="programTitle">프로그램명 <span class="required-mark">*</span></label>
              <input type="text" id="programTitle" required placeholder="예: 비비드 캠프 2026">
            </div>
            <div class="form-group form-group-narrow">
              <label for="programIcon">아이콘 (이모지)</label>
              <input type="text" id="programIcon" value="🎓">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="programStatus">모집 상태</label>
              <select id="programStatus">
                <option value="recruiting">recruiting (모집중)</option>
                <option value="ongoing">ongoing (진행중)</option>
                <option value="preparing">preparing (준비중)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="programOrder">표시 순서</label>
              <input type="number" id="programOrder" value="0">
            </div>
          </div>

          <div class="ai-assistant-box" data-target="programDescription"></div>

          <div class="form-group">
            <label for="programDescription">설명 / 요약 내용 <span class="required-mark">*</span></label>
            <textarea id="programDescription" required class="textarea-medium"></textarea>
          </div>

          <div class="btn-group">
            <button type="submit" id="programSubmitBtn">프로그램 저장하기</button>
            <button type="button" class="secondary" data-action="hide-program-editor">취소</button>
          </div>
        </form>

        <div id="programStatusMsg" class="status-msg"></div>
      </div>
    </div>

  </div>

  <!-- 3. 실시간 HTML 미리보기 모달 -->
  <div id="previewModal" class="modal">
    <div class="modal-content no-scrollbar overscroll-contain">
      <button class="modal-close" id="modalCloseBtn">&times;</button>
      <div class="modal-meta">
        <span id="modalTypeChip" class="type-chip">뉴스</span>
        <span id="modalDate" class="modal-date"></span>
      </div>
      <h2 id="modalTitle" class="modal-title"></h2>
      <img id="modalImg" class="modal-image">
      <!-- innerHTML로 프론트엔드 스타일그대로 실시간 렌더링 -->
      <div id="modalContent" class="preview-body"></div>
    </div>
  </div>

  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/uiHelper.js"></script>
  <script src="./assets/js/postManager.js"></script>
  <script src="./assets/js/programManager.js"></script>
  <script src="./assets/js/main.js?v=20260815-modal-scroll-lock"></script>
  <script src="./assets/js/ai-assistant.js?v=20260816-backend-generation"></script>
</body>
</html>
