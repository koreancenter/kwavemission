<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Wave Mission 관리자 - 글 작성</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    textarea { height: 250px; resize: vertical; }
    button { background: #0056b3; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #003d82; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>뉴스레터 새 글 작성</h1>

  <form id="postForm">
    <div class="form-group">
      <label for="title">제목</label>
      <input type="text" id="title" required placeholder="뉴스레터 제목을 입력하세요">
    </div>

    <div class="form-group">
      <label for="content">본문 내용 (HTML 가능)</label>
      <textarea id="content" required placeholder="내용을 입력하세요..."></textarea>
    </div>

    <button type="submit">글 등록하기</button>
  </form>

  <div id="status"></div>

  <script>
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = '등록 중...';
      statusDiv.style.color = 'black';

      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      try {
        const response = await fetch('/api/write-post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusDiv.textContent = '글이 성공적으로 등록되었습니다!';
          statusDiv.style.color = 'green';
          document.getElementById('postForm').reset();
        } else {
          statusDiv.textContent = '등록 실패: ' + (result.error || '알 수 없는 오류');
          statusDiv.style.color = 'red';
        }
      } catch (err) {
        statusDiv.textContent = '통신 에러가 발생했습니다.';
        statusDiv.style.color = 'red';
      }
    });
  </script>

</body>
</html>
